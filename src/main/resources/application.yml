integration:
  party-assets:
    queue: api-fabriken.party-overview.party-assets
logging:
  level:
    root: 'INFO'
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-partyoverview
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
    open-in-view: false
